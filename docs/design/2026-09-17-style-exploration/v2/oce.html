<script>const deviceData=[{name:'白色设计主机',person:'陈先生 · 今天 16:00 取机',photo:'case',no:'SO-0917-003',status:'待交机',next:'核对附件与尾款'},{name:'双屏设计工作站',person:'林女士 · 等待配件到货',photo:'desk',no:'SO-0917-002',status:'装机中',next:'补齐 1 件固态硬盘'},{name:'显卡检测',person:'周先生 · 间歇性黑屏',photo:'gpu',no:'RE-0917-008',status:'待检测',next:'记录检测结果'}];let lastFocus;function openDevice(i){lastFocus=document.activeElement;const d=deviceData[i];document.querySelector('#drawerImg').src=MEDIA[d.photo];document.querySelector('#drawerName').textContent=d.name;document.querySelector('#drawerNo').textContent=d.no;document.querySelector('#drawerPerson').textContent=d.person;document.querySelector('#drawerStatus').textContent=d.status;document.querySelector('#drawerNext').textContent=d.next;document.querySelector('#drawer').hidden=false;document.querySelector('#drawerClose').focus();}function closeDevice(){document.querySelector('#drawer').hidden=true;lastFocus?.focus();}document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>openDevice(Number(b.dataset.device)));document.querySelector('#drawerClose').onclick=closeDevice;document.querySelector('#drawer').onclick=e=>{if(e.target.id==='drawer')closeDevice()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDevice()});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-stage]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-status]').forEach(card=>card.hidden=b.dataset.stage!=='全部'&&card.dataset.status!==b.dataset.stage);});});</script></body></html>
