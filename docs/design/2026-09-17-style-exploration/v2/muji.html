<main><header class="ledger-header"><div class="mobile-only statusbar"><span>9:41</span><span>•••　◎</span></div><div class="date-line"><span>2026 年 9 月 17 日　星期四</span><span class="desktop-only">今日记录　/　001</span></div><div class="ledger-heading"><h1>今日台账</h1><div class="header-actions"><button data-preview="打印台账" class="print desktop-only"><span data-icon="print"></span>打印</button><button class="solid" data-preview="新建订单">＋ 开单</button></div></div><div class="ledger-totals"><div><span>待交机</span><strong>3<small>台</small></strong></div><div><span>缺货</span><strong>2<small>单</small></strong></div><div><span>待维修</span><strong>4<small>单</small></strong></div><div class="receivable"><span>待收款</span><strong>12,800<small>元</small></strong></div></div></header>
<section class="ledger-main"><div class="register"><div class="section-heading"><h2><span>一</span>待办记录</h2><div class="filter-row"><button class="active" data-filter="全部">全部</button><button data-filter="交付">交付</button><button data-filter="入库">入库</button><button data-filter="维修">维修</button></div></div><div class="table-wrap"><table><thead><tr><th class="select-col"><input type="checkbox" aria-label="全选" id="selectAll"></th><th>时间</th><th>客户 / 单号</th><th>事项</th><th>状态</th><th class="amount">待收 / 元</th><th></th></tr></thead><tbody id="ledgerRows"></tbody></table></div><div class="table-footer"><span id="selectedCount">6 条记录</span><button data-preview="导出所选记录">导出所选记录 ↗</button></div><div class="section-heading second"><h2><span>二</span>设备资料</h2><button data-preview="全部设备资料">全部资料 →</button></div><div class="equipment-sheet"><button class="equipment" data-record="0"><img data-photo="case" alt="白色机箱示意图"><div><span class="paper-tag">整机 · 新品</span><h3>白色设计主机</h3><p>陈先生 / SO-0917-003</p><dl><div><dt>检测</dt><dd>已通过</dd></div><div><dt>交付</dt><dd>今天 16:00</dd></div></dl></div></button><button class="equipment" data-record="2"><img data-photo="gpu" alt="显卡示意图"><div><span class="paper-tag">售后 · 已接收</span><h3>显卡检测</h3><p>周先生 / RE-0917-008</p><dl><div><dt>故障</dt><dd>间歇性黑屏</dd></div><div><dt>进度</dt><dd>待检测</dd></div></dl></div></button></div><div class="inline-scan"><span data-icon="scan"></span><input placeholder="扫描或输入 SN / 设备编号" aria-label="输入设备编号"><button data-preview="设备查询">查询 →</button></div></div>

<dialog id="recordDialog"><form method="dialog"><button class="close-dialog" aria-label="关闭">×</button></form><span class="dialog-caption">单据记录</span><h2 id="recordName"></h2><p id="recordNo"></p><dl><div><dt>事项</dt><dd id="recordTask"></dd></div><div><dt>当前状态</dt><dd id="recordStatus"></dd></div><div><dt>待收款</dt><dd id="recordMoney"></dd></div></dl><button class="solid" data-preview="处理所选单据">处理单据 →</button></dialog>
<script>const rows=[{time:'16:00',name:'陈先生',no:'SO-0917-003',task:'白色主机交付',status:'待交机',amount:'4,280.00',type:'交付'},{time:'17:30',name:'林女士',no:'SO-0917-002',task:'固态硬盘到货',status:'缺货 1 件',amount:'—',type:'入库'},{time:'待安排',name:'周先生',no:'RE-0917-008',task:'显卡检测',status:'待检测',amount:'待核实',type:'维修'},{time:'18:00',name:'赵先生',no:'SO-0916-011',task:'办公主机交付',status:'已收齐款',amount:'0.00',type:'交付'},{time:'待安排',name:'刘女士',no:'RE-0916-006',task:'主板维修确认',status:'待确认',amount:'待核实',type:'维修'},{time:'待确认',name:'吴先生',no:'SO-0916-009',task:'显示器到货',status:'在途',amount:'—',type:'入库'}];let filter='全部';const selected=new Set();function render(){document.querySelector('#ledgerRows').innerHTML=rows.map((r,i)=>({...r,i})).filter(r=>filter==='全部'||r.type===filter).map(r=>`<tr><td class="select-col"><input type="checkbox" aria-label="选择${r.name}记录" data-select="${r.i}" ${selected.has(r.i)?'checked':''}></td><td class="time-col">${r.time}</td><td class="customer-col"><b>${r.name}</b><small>${r.no}</small></td><td class="task-col">${r.task}</td><td class="state-col"><span class="state ${r.type==='入库'?'pending':''}">${r.status}</span></td><td class="amount">${r.amount}</td><td class="open-col"><button data-record="${r.i}" aria-label="查看${r.name}记录">→</button></td></tr>`).join('');document.querySelectorAll('[data-select]').forEach(c=>c.onchange=()=>{c.checked?selected.add(+c.dataset.select):selected.delete(+c.dataset.select);updateCount()});wireRecords();updateCount();}function updateCount(){document.querySelector('#selectedCount').textContent=selected.size?'已选 '+selected.size+' 条':(filter==='全部'?6:rows.filter(r=>r.type===filter).length)+' 条记录';}function wireRecords(){document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.record];document.querySelector('#recordName').textContent=r.name;document.querySelector('#recordNo').textContent=r.no;document.querySelector('#recordTask').textContent=r.task;document.querySelector('#recordStatus').textContent=r.status;document.querySelector('#recordMoney').textContent=r.amount;document.querySelector('#recordDialog').showModal()});}document.addEventListener('DOMContentLoaded',()=>{render();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#selectAll').onchange=e=>{rows.forEach((r,i)=>{if(filter==='全部'||r.type===filter)e.target.checked?selected.add(i):selected.delete(i)});render()};});</script></body></html>
