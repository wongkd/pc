<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A · 苹果 / 任务工作台</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="apple.css"><script src="shared.js"></script></head><body>
<aside class="rail"><a class="wordmark" href="../v2/index.html"><span class="appmark">P</span><strong>装机店</strong></a><div class="rail-section">工作空间</div><nav><button class="active" data-preview="今天"><span data-icon="home"></span>今天 <b>9</b></button><button data-preview="开单"><span data-icon="order"></span>开单</button><button data-preview="库存"><span data-icon="box"></span>库存</button><button data-preview="售后"><span data-icon="repair"></span>售后</button><button data-preview="回收置换"><span data-icon="recycle"></span>回收置换</button><button data-preview="账本"><span data-icon="book"></span>账本</button></nav><div class="rail-foot"><button data-preview="设置"><span data-icon="settings"></span>设置</button><div class="account"><i>王</i><div>王店长<small>管理员</small></div><span>⌄</span></div></div></aside>
<main class="workspace"><header class="toolbar"><span class="crumb">工作空间 <i>/</i> 今天</span><div class="searchbar"><span data-icon="search"></span><input aria-label="搜索任务" id="search" placeholder="搜索客户、单号、SN"><kbd>⌘ K</kbd></div><button class="scan-top" data-preview="扫码查设备"><span data-icon="scan"></span></button></header><div class="mobile-title mobile-only"><div class="mobile-status"><span>9:41</span><span>•••　◎</span></div><div class="mobile-heading"><h1>今天</h1><button data-preview="扫码"><span data-icon="scan"></span></button></div></div><section class="heading"><div><p>9 月 17 日，星期四</p><h1>今日待办</h1></div><button class="primary" data-preview="新建订单"><span data-icon="plus"></span>开单</button></section>
<div class="summary"><button class="selected" data-filter="待交机"><span class="stat-icon blue" data-icon="order"></span><div><b>3</b><span>待交机</span></div></button><button data-filter="待补货"><span class="stat-icon orange" data-icon="box"></span><div><b>2</b><span>缺货订单</span></div></button><button data-filter="待检测"><span class="stat-icon purple" data-icon="repair"></span><div><b>4</b><span>维修待办</span></div></button><button data-preview="待收款明细"><div><b>¥12,800</b><span>待收款 · 5 张单</span></div><span class="summary-arrow">↗</span></button></div>
<section class="split-view"><div class="inbox"><div class="inbox-head"><strong>任务</strong><button class="iconbutton" data-preview="筛选任务"><span data-icon="filter"></span></button></div><div class="segments"><button class="active" data-filter="全部">全部</button><button data-filter="待交机">交付</button><button data-filter="待补货">缺货</button><button data-filter="待检测">维修</button></div><div class="group-title">今天 <span>6</span></div><div id="tasklist"></div><button class="completed" data-preview="已完成任务"><span data-icon="check"></span>已完成 <span>8　›</span></button></div>
<article class="detail" id="detail"><div class="detail-top"><button class="mobile-only back" id="back"><span data-icon="back"></span>任务</button><span class="order-no" id="orderNo">SO-0917-003</span><button class="iconbutton" data-preview="更多订单操作">•••</button></div><div class="detail-title"><div><span class="pill green" id="detailStatus">待交机</span><h2 id="detailName">陈先生 · 白色装机</h2><p id="detailSub">约定今天 16:00 到店取机</p></div><button class="contact" data-preview="客户资料"><span data-icon="phone"></span></button></div><div class="product-block"><img data-photo="case" alt="白色机箱示意图" id="detailPhoto"><div class="product-info"><span>设备配置</span><h3 id="deviceTitle">白色设计主机</h3><p id="deviceSpec">32GB 内存 / 1TB SSD<br>独立显卡 · 新品装配</p><button class="textbutton" data-preview="完整配置清单">查看 8 项配置 →</button></div></div><div class="stepper"><span class="done">✓<small>已接单</small></span><i></i><span class="done">✓<small>备货</small></span><i></i><span class="done">✓<small>检测</small></span><i class="mutedline"></i><span class="current">4<small>交付</small></span></div><div class="check-head"><h3>交付检查</h3><span id="checksCount">2 / 3</span></div><div class="checks"><label><input type="checkbox" checked><span>配置与序列号已核对</span><small>14:20</small></label><label><input type="checkbox" checked><span>点亮、烤机测试通过</span><small>14:35</small></label><label><input type="checkbox"><span>配件、附件已打包</span></label></div><div class="detail-footer"><div><small>待收尾款</small><strong>¥4,280<span>订单总额 ¥6,280</span></strong></div><button class="primary" data-preview="交付核对">查看交付 <span data-icon="arrow"></span></button></div></article></section></main>
<nav class="mobile-nav mobile-only"><button class="active" data-preview="今天"><span data-icon="home"></span>今天</button><button data-preview="开单"><span data-icon="order"></span>开单</button><button data-preview="库存"><span data-icon="box"></span>库存</button><button data-preview="更多"><span data-icon="more"></span>更多</button></nav>
<script>
const tasks=[{name:'陈先生 · 白色装机',sub:'今天 16:00 · 尾款 ¥4,280',status:'待交机',photo:'case',no:'SO-0917-003'},{name:'林女士 · 设计主机',sub:'缺少固态硬盘 · 到货待确认',status:'待补货',photo:'desk',no:'SO-0917-002'},{name:'周先生 · 显卡检测',sub:'已接收 · 间歇性黑屏',status:'待检测',photo:'gpu',no:'RE-0917-008'},{name:'赵先生 · 办公主机',sub:'今天 18:00 · 已收齐款',status:'待交机',photo:'pc',no:'SO-0916-011'},{name:'刘女士 · 主板更换',sub:'待确认维修方案',status:'待检测',photo:null,no:'RE-0916-006'},{name:'吴先生 · 双屏配置',sub:'缺少显示器 · 在途',status:'待补货',photo:'desk',no:'SO-0916-009'}];let selected=0,filter='全部';
function renderTasks(){const q=document.querySelector('#search').value.trim();document.querySelector('#tasklist').innerHTML=tasks.map((t,i)=>({...t,i})).filter(t=>(filter==='全部'||t.status===filter)&&(!q||t.name.includes(q)||t.no.includes(q))).map(t=>`<button class="task-row ${selected===t.i?'active':''}" data-task="${t.i}">${t.photo?photo(t.photo,'taskphoto'):icon('repair')}<div><strong>${t.name}</strong><small>${t.sub}</small></div><span class="task-dot ${t.status==='待补货'?'amber':''}"></span></button>`).join('');document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>selectTask(Number(b.dataset.task)));}
function selectTask(i){selected=i;const t=tasks[i];document.querySelector('#detailName').textContent=t.name;document.querySelector('#detailSub').textContent=t.sub;document.querySelector('#detailStatus').textContent=t.status;document.querySelector('#orderNo').textContent=t.no;document.querySelector('#detailPhoto').src=MEDIA[t.photo||'case'];document.querySelector('#deviceTitle').textContent=i===0?'白色设计主机':t.name.split(' · ')[1];document.querySelector('#deviceSpec').textContent=i===0?'32GB 内存 / 1TB SSD · 独立显卡':t.sub;document.querySelector('#detail').classList.add('open');document.querySelectorAll('.stepper,.check-head,.checks,.detail-footer').forEach(e=>e.hidden=i!==0);renderTasks();}
document.addEventListener('DOMContentLoaded',()=>{renderTasks();document.querySelector('#search').oninput=renderTasks;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.segments button').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));renderTasks();});document.querySelector('#back').onclick=()=>document.querySelector('#detail').classList.remove('open');document.querySelectorAll('.checks input').forEach(c=>c.onchange=()=>document.querySelector('#checksCount').textContent=document.querySelectorAll('.checks input:checked').length+' / 3');});
</script></body></html>
