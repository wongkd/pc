<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>装机店 · 三种界面结构</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e9e8;font:14px/1.6 "Microsoft YaHei",sans-serif;color:#303632}header{display:flex;align-items:center;gap:25px;padding:19px 30px;background:#fafbf8;border-bottom:1px solid #d6dbd1}h1{font-size:16px;margin:0}header small{font-size:10px;font-weight:400;color:#8c9588;margin-left:12px}.variants{display:flex;gap:5px;margin-left:20px}button{font:inherit;cursor:pointer;background:none;border:0;color:#858e81;padding:9px 15px;font-size:12px;border-radius:5px}button.active{background:#e6ece0;color:#2b442f}button:focus-visible,a:focus-visible{outline:3px solid #367ac2;outline-offset:3px}.tools{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:11px}.tools button{font-size:10px}.tools a{color:#6e7a67;text-decoration:none}.info{padding:17px 30px;display:flex;justify-content:space-between;gap:20px;color:#727d6b;font-size:11px}.info strong{font-weight:500;color:#4a5743}.stage{display:flex;justify-content:center;align-items:flex-start;padding:0 26px 30px;overflow:auto}iframe{display:block;border:1px solid #d4d9cf;background:white;box-shadow:0 15px 50px #2c3f2610;width:100%;height:calc(100vh - 150px);border-radius:6px}.stage.mobile iframe{width:390px;min-width:390px;height:844px;border-radius:23px;border:6px solid #333b33}.stage.gray iframe{filter:grayscale(1)}@media(max-width:900px){header{flex-wrap:wrap;padding:15px 18px;gap:12px}.variants{margin:0}.tools{margin:0}.info{padding:14px 18px;display:block}.info>span{display:block;margin-top:5px}.stage{padding:0 12px 20px}.stage.mobile iframe{min-width:0;max-width:100%}header small{display:none}button{padding:8px 10px;font-size:11px}}
</style></head><body><header><h1>装机店 · 界面方案 <small>第二轮 / 示例数据</small></h1><nav class="variants" aria-label="选择设计方案"><button class="active" data-style="apple">A　苹果 · 任务工作台</button><button data-style="oce">B　OCE · 设备看板</button><button data-style="muji">C　MUJI · 经营台账</button></nav><div class="tools"><button id="size">手机布局</button><button id="gray">黑白比较</button><a id="newtab" href="apple.html" target="_blank" rel="noopener">独立打开 ↗</a></div></header><div class="info"><strong id="description">三栏：导航 → 任务列表 → 订单详情。选择任务、筛选和交付勾选可以操作。</strong><span>视觉与交互原型 · 未连接业务接口</span></div><div class="stage" id="stage"><iframe id="preview" src="apple.html" title="苹果任务工作台预览"></iframe></div><script>
const descriptions={apple:'三栏：导航 → 任务列表 → 订单详情。选择任务、筛选和交付勾选可以操作。',oce:'顶部导航 + 设备照片看板 + 时间待办。点击设备展开资料，手机横向浏览设备。',muji:'目录 + 经营表格 + 交付核对单。支持按事项筛选、勾选记录、打开单据。'};
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#preview').src=b.dataset.style+'.html';document.querySelector('#preview').title=b.textContent+'预览';document.querySelector('#newtab').href=b.dataset.style+'.html';document.querySelector('#description').textContent=descriptions[b.dataset.style];});document.querySelector('#size').onclick=()=>{const on=document.querySelector('#stage').classList.toggle('mobile');document.querySelector('#size').textContent=on?'桌面布局':'手机布局';};document.querySelector('#gray').onclick=()=>{const on=document.querySelector('#stage').classList.toggle('gray');document.querySelector('#gray').textContent=on?'恢复颜色':'黑白比较';};
</script></body></html>
