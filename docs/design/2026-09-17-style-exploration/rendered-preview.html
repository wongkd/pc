nt-size:11px;color:var(--accent)}.content{padding:27px}.titlebar{display:flex;align-items:center;justify-content:space-between}.greeting{font-size:28px;letter-spacing:-.8px;font-weight:600;line-height:1.4}.sub{color:var(--muted);font-size:12px;margin-top:6px}.primary{background:var(--accent);color:white;padding:10px 20px;border-radius:9px;font-size:12px;display:flex;align-items:center;gap:8px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:23px 0}.metric{padding:16px 19px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}.metric-label{font-size:12px;color:var(--muted)}.number{font-size:28px;line-height:1.5;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.6px}.number.money{font-size:26px}.metric-foot{font-size:10px;color:var(--muted)}.metric-foot em{font-style:normal;color:var(--accent)}.workarea{display:grid;grid-template-columns:1fr 250px;gap:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sectionhead strong{font-size:16px}.link{font-size:11px;color:var(--accent)}.tasks{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.tabs{display:flex;gap:22px;color:var(--muted);font-size:11px;margin-bottom:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}.tabs span:first-child{color:var(--accent);font-weight:600}.task{display:flex;gap:13px;align-items:center;min-height:94px;border-bottom:1px solid var(--line)}.task:last-child{border:0}.thumb{height:49px;width:49px;border-radius:8px;object-fit:cover;object-position:center;background:#efefef;flex-shrink:0}.taskinfo{flex:1;min-width:0}.taskinfo strong{font-size:12px;font-weight:600}.taskinfo small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.taskright{text-align:right;min-width:66px}.tag{font-size:10px;color:#846c38;background:#f8f2e4;border-radius:4px;padding:3px 7px;display:inline-block}.tag.green{background:#edf3e9;color:#4b7050}.tag. </style></head><body><div id="root"></div><script>
const style=new URLSearchParams(location.search).get('style')||'apple';document.body.className=style;

const info={apple:['A · 苹果式轻质感','浅灰白 · 蓝色主操作 · 圆角卡片'],oce:['B · OCE 灵感生活方式','奶油白 · 森林绿 · 低饱和色块'],muji:['C · MUJI 灵感朴素工具','暖白 · 墨灰 · 深红主操作 · 细分隔线']}[style];

const taskHtml=tasks.map((t,i)=>`<div class="task"><img class="thumb" src="${photo}" style="object-position:${i?65:40}% 50%"><div class="taskinfo"><strong>${t[0]}</strong><small>${t[1]}</small></div><div class="taskright"><span class="tag ${t[3]}">${t[2]}</span><div class="taskaction">${t[4]} →</div></div></div>`).join('');
document.getElementById('root').innerHTML=`<div class="board"><div class="boardhead"><div><div class="kicker">PC QUOTE · MULTI-PLATFORM DESIGN STUDY</div><h1>${info[0]}</h1><p>${info[1]}</p></div><div class="palette"><i></i><i></i><i></i></div></div><div class="screens"><div class="desktop"><aside class="sidebar"><div class="brand"><span class="mark">PC</span><div><strong>装机店工作台</strong></div></div>${nav.map((n,i)=>`<div class="navitem ${i?'':'active'}">${icon(n[0])}${n[1]}</div>`).join('')}<div class="navfoot"><div class="navitem">${icon('settings')}设置</div></div></aside><div class="main"><div class="topbar"><div class="search">${icon('search')}搜索客户 / 单号 / 硬件型号 / SN</div><div style="display:flex;gap:16px;align-items:center;color:var(--muted);font-size:11px">9月17日 · 星期四 <span class="user">店长</span></div></div><div class="content"><div class="titlebar"><div><div class="greeting">今日待办</div></div><div class="primary"><span style="font-size:18px;line-height:1">＋</span>开单</div></div><div class="metrics">${metrics.map((m,i)=>`<div class="metric"><div class="metric-label">${m[0]}</div><div class="number ${i===3?'money':''}">${m[1]}</div><div class="metric-foot">${m[2]}</div></div>`).join('')}</div><div class="workarea"><div><section class="tasks"><div class="sectionhead"><strong>待办列表</strong><span class="link">查看全部 →</span></div><div class="tabs"><span>全部</span><span>待交机</span><span>待补货</span><span>待维修</span></div>${taskHtml}</section><div class="shortcuts">${[['scan','扫码入库'],['repair','接收维修'],['recycle','旧机估价']].map(v=>`<div class="quick">${icon(v[0])}${v[1]}</div>`).join('')}</div></div><div><div class="feature"><img class="featureimage" src="${photo}"><div class="featurecopy"><strong>常用配置</strong><p>办公配置 · 6 件配件</p><span class="link">套用配置 →</span></div></div><div class="used"><strong>二手可用库存</strong><div class="usedrow">${icon('gpu')}<div><strong>显卡 U-017</strong><small>已检测 · 可用于装机</small></div></div><div class="link" style="margin-top:12px">查看库存 →</div></div></div></div </script></body></html>
